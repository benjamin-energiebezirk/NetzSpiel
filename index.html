const $=s=>document.querySelector(s),app=$('#app'),dialogs=$('#dialog-root');

const storage={get(k,f){try{return JSON.parse(localStorage.getItem('netzmeister-'+k))??f;}catch{return f;}},set(k,v){try{localStorage.setItem('netzmeister-'+k,JSON.stringify(v));return true;}catch{return false;}}};

function startPage(){stopRealtime();stopAuto();stopReplay();screen='start';app.innerHTML=`<div class="shell">${header()}<main class="start"><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> BEZIRK FREISTADT · DEINE NETZLEITSTELLE</div><h1>Unser Bezirk.<br>Dein Netz.<br><em>Dein Zug.</em></h1><p>Plane ein fiktives Energiesystem auf der Karte des Bezirks Freistadt. Sonne, Wind, Speicher und du: Wie bringst du den Bezirk durch den Tag?</p><div class="round-pill">${SCENARIOS[selected].realtime?'Echtzeit-Finale · 18 Sekunden pro Modellstunde':'24 Runden · 1 Stunde pro Runde'}</div><div class="hero-actions"><button class="primary" data-action="start">Spiel starten <span>↗</span></button>${saved?'<button class="secondary" data-action="resume">Fortsetzen ↻</button>':'<button class="textbtn" data-action="tutorial">Tutorial: 6 Runden →</button>'}</div><div class="hero-foot"><span>Direkt im Browser</span><span>Ohne Anmeldung</span><span>Rundenbasiert</span></div></div><div class="hero-world"><div class="world freistadt-world">${scene({interactive:false})}</div><div class="float-tag solar"><strong>Freistadt unter Strom.</strong></div><div class="float-tag status"><span class="tag-symbol">ϟ</span><div><strong>Die Region wartet auf deinen Plan.</strong><small></small></div></div></div></section><section class="scenario-section"><div class="sectionline"><h2>Welchen Tag spielst du?</h2><p></p></div><div class="scenarios">${SCENARIOS.map((x,i)=>`<button class="scenario ${selected===i?'selected':''}" data-scenario="${i}" aria-pressed="${selected===i}"><span class="tiny">${x.tag}</span><span class="scenario-icon">${['☀','↗','☁','ϟ','⏱'][i]}</span><h3>${x.name}</h3><p>${x.desc}</p><div class="scenario-bottom"><span>${x.hours} Runden · ${x.difficulty}</span><span>${selected===i?'●':'↗'}</span></div></button>`).join('')}</div></section><section class="arcade-teaser"><div><span class="tiny">ARCADE · FIKTIVE REKORDE</span><strong>SOLAR-PANDA <b>986 function begin(id=selected,seed){stopRealtime();state=newGame(id,seed??(id===0?17:Math.floor(Math.random()*9973)+1),profile.upgrades);lastFeedback=state.scenario.realtime?'Stelle den Plan ein. Der nächste Tick führt die Stunde automatisch aus.':'Dein Fahrplan für die nächste Stunde.';save();gamePage();if(state.scenario.realtime)realtimeBriefing();}

function stopRealtime(){if(liveTimer)clearInterval(liveTimer);liveTimer=null;liveActive=false;}

function launchRealtime(){closeModal();stopRealtime();liveRemaining=state.scenario.seconds;liveActive=true;updateClock();liveTimer=setInterval(()=>{if(!liveActive||screen!=='game'||!state.scenario.realtime||state.done){stopRealtime();return;}if(dialogs.innerHTML||document.hidden)return;liveRemaining--;updateClock();if(liveRemaining<=0){liveRemaining=state.scenario.seconds;step();updateClock();}},1000);}
function realtimeBriefing(){stopRealtime();modal(`<div class="eyebrow">LEVEL 05 · ECHTZEIT-FINALE</div><h2 id="modal-title">Jetzt läuft die Uhr.</h2><p>Alle <strong>18 Sekunden</strong> führt die Leitstelle deinen aktuellen Fahrplan für eine simulierte Stunde aus. Deine Regler wirken auf den nächsten Tick. Speichergrenzen, Turbinenrampen, Abregel- und Exportlimits gelten weiter.</p><div class="notice">Ereigniskarten und geöffnete Erklärungen halten den Countdown an. Auch bei einem inaktiven Browser-Tab läuft dir keine Runde davon.</div><p class="model-note">Die Echtzeit-Challenge dauert etwa 7 Minuten plus Entscheidungszeiten. Die anderen Levels bleiben rundenbasiert.</p><button class="primary" data-action="live-start" style="margin-top:24px">Leitstelle live schalten ⏱</button>`,false);}

function hint(r){if(state.scenario.id===0)return [
 'Willkommen! Die Sonne liefert viel Strom. Stelle den Pumpspeicher auf „Laden“ und beobachte die Bilanz.',
 'Gespeicherte Energie hilft später. Das Pumpspeicherkraftwerk erzeugt beim Ablassen Strom. Zum Hochpumpen braucht es zuvor mehr Strom, als es später zurückliefert.',
 'Ein Schritt ist eine Stunde. MW beschreiben Leistung, MWh die Energie dieser Stunde.',
 'Die Sonne wandert weiter. Die Vorschau rechts und die Prognose helfen dir beim Planen.',
 'Am Abend steigt der Verbrauch. Mit Entladen holst du gespeicherte Energie zurück ins Netz.',
 'Dein letzter Zug: Nutze Speicher und Biomasse. Versorgungssicherheit zählt am meisten.'
 ][state.turn];
 if(r.deficit>1)return `Es fehlen ${fmt(r.deficit)} MW. Speicher entladen oder Reserven erhöhen, bevor du die Stunde bestätigst.`;
 if(r.surplus>1)return `${fmt(r.surplus)} MW bleiben ungenutzt im Netz. Regelbare Kraftwerke reduzieren oder Speicher laden.`;
 if(r.curtail>0)return `Erneuerbare Energie im Überfluss: ${fmt(r.curtail)} MW werden abgeregelt. Ist noch Platz in deinen Speichern?`;
 if(r.w.h>=16&&r.w.h<=19)return 'Der Abend kommt. Weniger Sonne, mehr Verbrauch: Jetzt zeigt sich der Wert deiner Speicher.';
 if(r.charged>1)return ` ${fmt(r.charged)} MWh wandern diese Stunde in deine Speicher – vor Verlusten.`;
 if(r.output.gas>1||r.output.coal>1)return 'Reserve ist manchmal notwendig. Jede vermiedene Ausfallstunde zählt mehr als ein perfekter Energiemix.';
 if(state.stores.pump.energy+state.stores.battery.energy<12&&r.w.h>=15)return 'Die Speicher sind fast leer. Plane die Abendspitze und fahre regelbare Erzeugung früh genug hoch.';return 'Die Bilanz sieht gut aus. Behalte den Wetterbericht und die nächste Verbrauchsspitze im Blick.';}

function storageMode(k){return state.controls[k]<0?'charge':state.controls[k]>0?'discharge':(state.storeModes?.[k]??'stop');}

function plannedStorageBounds(k){
 const b=storageBounds(state,k);if(b.min>=0)return b;
 const maxCharge=Math.max(0,-simulate(state,{...state.controls,[k]:b.min}).record.storageFlow[k]);
 const min=maxCharge>0?-maxCharge:0,max=Math.max(min,b.max);
 return {min,max};
}
function normalizeStoragePlan(){
 state.controls=sanitizeControls(state);const r=simulate(state).record;state.storeModes??={};
 for(const k of Object.keys(STORE)){
  if(state.controls[k]<0){state.storeModes[k]='charge';state.controls[k]=r.storageFlow[k]<0?r.storageFlow[k]:0;}
 }
}

const flowLabel=v=>Math.abs(v)<.05?'Halten · 0 MW':`${v<0?'↓ Lädt':'↑ Liefert'} ${fmt(Math.abs(v),0)} MW`;
function plantControl(k,r){const p=PLANTS[k];return `<section class="control-group ${k==='bio'?'':'reserve'}" id="control-${k}"><label class="control-label" for="range-${k}"><span><span class="plant-icon">${icons[k]}</span>${p.name}</span><output id="out-${k}">${fmt(state.controls[k],0)} MW</output></label><input id="range-${k}" data-control="${k}" type="range" min="${Math.max(0,state.previous[k]-p.ramp)}" max="${Math.min(p.max,state.previous[k]+p.ramp,k==='bio'?p.max:state.fuel[k])}" step="1" value="${state.controls[k]}" aria-label="${p.name} nächste Runde erreichbare Leistung"><div class="control-detail" id="actual-${k}">Ist: ${fmt(r.output[k])} MW · Rampe ${p.ramp} MW/h${k!=='bio'?`<br>Reserve: ${fmt(state.fuel[k],0)} MWh · ${p.cost} €/MWh`:'<br>Regional regelbar · 65 €/MWh'}</div></section>`;}
function gamePage(){screen='game';state.controls=sanitizeControls(state);state.controls.curtail=false;const r=simulate(state).record,w=r.w;app.innerHTML=`<div class="shell">${header()}<main><div class="gamehead"><div><div class="eyebrow" style="font-size:8px">BEZIRK FREISTADT · ${state.scenario.tag} · RUNDE ${state.turn+1}/${state.scenario.hours}</div><h1>${state.scenario.name}</h1><p>${state.scenario.realtime?'Echtzeit: Alle 18 Sekunden wird der aktuelle Fahrplan für eine Stunde ausgeführt.':''}</p></div><div class="timeblock"><div class="clock">${time(w.h)}</div><span class="weatherpill">${state.turn?score(state).points:0} Punkte</span><button class="secondary" data-action="help">? Spielhilfe</button></div></div>${state.scenario.id===0?`<aside class="tutorial"><span class="tutorial-number">${state.turn+1}</span><div><strong>${['Erst erzeugen, dann speichern','Pumpen braucht Strom – Ablassen liefert Strom','Leistung und Energie','Vorausschauend planen','Der Abend braucht Reserven','Du hast die Leitstelle im Griff'][state.turn]}</strong><p>${hint(r)}</p></div></aside>`:''}${state.scenario.realtime?`<aside class="realtime-banner"><span>⏱ ECHTZEIT · NÄCHSTE STUNDE IN <b id="countdown">${liveRemaining} s</b></span><small>Dein aktueller Plan wird automatisch übernommen.</small><div class="countdown-track"><i id="countdown-fill" style="width:100%"></i></div></aside>`:''}<div class="game-grid"><div class="stage-column"><div id="game-world" class="world game-world freistadt-world"></div><section id="plan-summary" class="plan-summary" aria-live="polite" aria-label="Strombilanz"></section><div id="balance" class="balance"></div><section class="timeline"><div class="timeline-top"><h3>Tagesverlauf</h3><span class="live-badge">PLAN</span></div><div class="history-scroll"><div id="chart"></div></div><div id="history-legend"></div><div class="forecast-label">Wetter</div><div id="forecast" class="forecast"></div></section></div><aside class="controls" aria-label="Energiesteuerung"><div class="control-title"><h2>Dein Fahrplan</h2><span></span></div><div class="control-scroll"><section class="control-group renew" id="control-renew"><label class="control-label" for="range-renew"><span><span class="plant-icon">☀</span>Erneuerbare</span><output id="out-renew">${fmt(r.renewAvailable,0)} MW</output></label><div id="renew-values" class="control-detail"></div><input id="range-renew" data-control="curtailMW" type="range" min="0" max="${CURTAIL.power}" step="1" value="${state.controls.curtailMW}" aria-label="Begrenzte Abregelung in Megawatt"><div class="control-sub"><span>Abregelung planen · max. 3 MW</span><span id="renew-percent"></span></div><button class="inline-help" data-action="curtail-info">Was bedeutet Abregelung? ⓘ</button><div id="actual-renew" class="control-feedback"></div></section>${storeControl('pump',r)}${storeControl('battery',r)}${plantControl('bio',r)}${plantControl('gas',r)}${plantControl('coal',r)}${plantControl('nuclear',r)}<section class="control-group export-control" id="control-export"><label class="control-label" for="range-export"><span><span class="plant-icon">↗</span>Stromexport</span><output id="out-export">0 MW</output></label><input id="range-export" data-control="export" type="range" min="0" max="${EXPORT.power}" step="1" value="${state.controls.export}" aria-label="Stromexport bis maximal vier Megawatt"><div class="control-detail">Enger Anschluss: max. ${EXPORT.power} MW · Erlös ${EXPORT.price} €/MWh</div><div id="actual-export" class="control-feedback"></div></section>${state.v2g?storeControl('v2g',r):''}</div><div class="control-actions"><div id="mini-balance" class="mini-balance" aria-live="polite"></div>${state.scenario.realtime?`<div class="live-submit"><span>⏱ Nächster Tick in <b id="countdown-mini">${liveRemaining} s</b></span><small>${time(w.h)} → ${time((w.h+1)%24)} · Plan wird automatisch ausgeführt</small></div>`:`<button class="primary" data-action="step">Runde ${state.turn+1} abschließen <span>${time(w.h)  for(const k of Object.keys(STORE)){if(k==='v2g'&&!state.v2g)continue;const bounds=plannedStorageBounds(k),input=$('#range-'+k),mode=storageMode(k),max=mode==='charge'?Math.max(0,-bounds.min):mode==='discharge'?bounds.max:0,actual=r.storageFlow[k],planned=r.stores[k].energy,delta=planned-state.stores[k].energy;input.min=mode==='charge'?Math.max(0,-bounds.max):mode==='discharge'?Math.max(0,bounds.min):0;input.max=max;input.value=Math.abs(state.controls[k]);input.disabled=max===0;$('#out-'+k).textContent=Math.abs(state.controls[k])+' MW';$('#mode-label-'+k).textContent=mode==='charge'?'Ladeleistung':mode==='discharge'?'Entladeleistung':'Speicher hält seinen Stand';$('#bound-min-'+k).textContent=input.min+' MW';$('#bound-max-'+k).textContent=max+' MW erreichbar';$('#storage-ghost-'+k).style.left=(planned/state.stores[k].capacity*100)+'%';$('#actual-'+k).innerHTML=`<strong>${flowLabel(actual)}</strong><span>Nach dieser Runde: <b>${fmt(planned)} MWh</b> (${delta>0?'+':''}${fmt(delta)} MWh)</span>${k==='pump'?'<small>Turbine: letzte Runde '+(state.previousStoreFlow?.pump??0)+' MW → jetzt erreichbar '+bounds.min+' bis '+bounds.max+' MW.</small>':''}${mode==='discharge'&&bounds.max<=0?'<small>Speicher leer.</small>':''}`;document.querySelectorAll(`[data-store="${k}"]`).forEach(button=>{button.disabled=button.dataset.mode==='charge'?bounds.min>=0:button.dataset.mode==='discharge'?bounds.max<=0:false;button.classList.toggle('active',button.dataset.mode===mode);});}

 const sc=score(state);updateClock();$('#cumulative').textContent=`${state.turn} Runden · Saldo ${fmt(sc.netCost,0)} € · ${fmt(sc.deficit)} MWh ungedeckt`;save();}
function chart(s,live=simulate(s).record){const width=1000,height=310,left=48,right=982,n=s.scenario.hours,cw=(right-left)/n,x=i=>left+i*cw+cw/2,max=Math.ceil(Math.max(60,live.totalSupply,live.demand+live.charged+live.exported,...s.history.flatMap(r=>[r.totalSupply,r.demand+r.charged+r.exported]),...Array.from({length:n},(_,i)=>conditions({...s,turn:i}).demand))/20)*20,y=v=>255-v/max*222;let shapes='',future='';
 for(let i=0;i<n;i++){const r=s.history[i]??(i===s.turn?live:null),w=conditions({...s,turn:i},0,i>s.turn);if(r){let base=255;for(const [k,name,color] of sourceInfo){const value=sourceValue(r,k),h=value/max*222;if(value>0){base-=h;shapes+=`<rect x="${x(i)-cw*.34}" y="${base}" width="${cw*.68}" height="${h}" fill="${color}"><title>${time(w.h)} · ${name}: ${value} MW</title></rect>`;}}
 let used=r.demand;for(const [key,name,value,pattern] of [['charge','Laden',r.charged,'charge-hatch'],['export','Export',r.exported,'export-hatch']]){if(value>0){shapes+=`<rect class="load-band ${key}-band" data-turn="${i}" data-mw="${value}" x="${x(i)-cw*.39}" y="${y(used+value)}" width="${cw*.78}" height="${value/max*222}" fill="url(#${pattern})" stroke="#c3404b" stroke-width="1.3" stroke-dasharray="4 3"><title>${name}: ${value} MW</title></rect>`;}used+=value;}
 if(i===s.turn)shapes+=`<rect x="${x(i)-cw*.46}" y="24" width="${cw*.92}" height="234" rx="4" fill="none" stroke="#d25538" stroke-width="2.5"/><text x="${x(i)}" y="16" text-anchor="middle" fill="#b34229" font-size="10" font-weight="800">PLAN</text>`;shapes+=`<path d="M${x(i)-cw*.39} ${y(r.demand)}h${cw*.78}" stroke="#262c46" stroke-width="3"/>`;}
 if(i>=s.turn)future+=`${i===s.turn?'M':'L'}${x(i)},${y(w.demand)} `;
 if(i%2===0||i===n-1||n===6)shapes+=`<text x="${x(i)}" y="282" text-anchor="middle" font-size="12" fill="#696878">${String(w.h).padStart(2,'0')}:00</text>`;}
 return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Tagesverlauf aller Energieformen in Megawatt. Laden und Export sind rot schraffiert."><defs><pattern id="charge-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#ffe6e9" fill-opacity=".7"/><path d="M-2 2 2-2M0 7 7 0M5 9 9 5" stroke="#d34555" stroke-width="1.8"/></pattern><pattern id="export-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f7c8cb" fill-opacity=".7"/><path d="M-2 5 2 9M0 0 7 7M5-2 9 2" stroke="#ad2938" stroke-width="1.8"/></pattern></defs>${Array.from({length:5},(_,i)=>{const v=max*i/4;return `<path d="M48 ${y(v)}H982" stroke="#d9d8e0" stroke-width="1"/><text x="37" y="${y(v)+4}" text-anchor="end" fill="#777887" font-size="11">${v}</text>`;}).join('')}<text x="10" y="16" fill="#777887" font-size="11">MW</text>${shapes}<path d="${future}" stroke="#757a94" fill="none" stroke-dasharray="5 6" stroke-width="2"/></svg>`;}

function curtailInfo(){modal(`<div class="eyebrow">SO FUNKTIONIERT ABREGELUNG</div><h2 id="modal-title">Weniger einspeisen ist möglich.</h2><p>PV- und Windanlagen können ihre Einspeisung technisch reduzieren. Auch Wasserkraft kann bei Netzengpässen abgeregelt werden. Dabei wird nutzbare erneuerbare Energie nicht eingespeist.</p><p class="model-note">In der Realität erfolgen solche Eingriffe nach technischen, vertraglichen und gesetzlichen Regeln. Im Spiel kannst du vereinfachend alle erneuerbaren Anlagen zentral begrenzen. Speichern, Lastverschiebung und der stark begrenzte Export helfen, Abregelung zu vermeiden.</p><p class="model-note">Quelle: <a href="https://energiegemeinschaften.gv.at/flexibilitaeten/" target="_blank" rel="noopener">Österreichische Koordinationsstelle für Energiegemeinschaften</a> · <a href="https://www.apg.at/news-presse/wind-und-sonne-koennen-starke-rueckgaenge-bei-wasserkraft-noch-nicht-kompensieren/" target="_blank" rel="noopener">APG zu Abregelung von Wasser- und Windkraft</a>.</p><button class="primary" data-action="close" style="margin-top:20px">Zurück zum Fahrplan ↗</button>`);}
function help(){modal(`<h2 id="modal-title">Erst planen.<br>Dann die Runde abschließen.</h2><p>Regler einstellen und die Strombilanz unter der Karte ausgleichen. Bei Überschuss laden oder exportieren; bei Mangel entladen oder Erzeugung erhöhen.</p><p>„Runde abschließen“ führt deinen Plan für eine Stunde aus. In Level 5 läuft jede Stunde nach 18 Sekunden automatisch weiter.</p><button class="primary" data-action="close" style="margin-top:20px">Los geht's</button>`);}

function model(){stopAuto();modal(`<div class="eyebrow">TRANSPARENTES SPIELMODELL · </div><h2 id="modal-title">Spielerisch. Aber mit Bilanz.</h2><p>Fiktives Energiesystem im Bezirk Freistadt. Leistungen, Kosten und Emissionen sind Spielannahmen.</p><table class="model-table"><thead><tr><th>Anlage</th><th>Leistung</th><th>Modell-Eigenschaft</th></tr></thead><tbody><tr><td>PV / Wind / Laufwasser</td><td>50 / 38 / 7 MW</td><td>Wetterabhängig; Wasser 6 MW in Dunkelflaute</td></tr><tr><td>Pumpspeicher</td><td>±19 MW · 95 MWh</td><td>78 % pro Lade-/Entladezyklus</td></tr><tr><td>Batterie</td><td>±12 MW · 30 MWh</td><td>90 % pro Zyklus</td></tr><tr><td>Biomasse</td><td>9 MW</td><td>Rampe 3 MW/h</td></tr><tr><td>Gas / Kohle</td><td>22 / 10 MW</td><td>Rampe 7 / 3 MW/h; begrenzte Brennstoffreserve</td></tr><tr><td>Importenergie</td><td>14 MW</td><td>115 MWh pro Spieltag; 225 €/MWh</td></tr></tbody></table><p class="model-note"><strong>Speicher:</strong> ΔE = Ladeleistung × η × 1 h − Entladeleistung ÷ η × 1 h. η ist die Wurzel des Zykluswirkungsgrades. Startfüllung 60 %, aus früherem erneuerbarem Überschuss. Das Pumpspeicherkraftwerk kann seine Leistung pro Runde nur um 4 MW ändern; ein Wechsel vom Pumpen zur Erzeugung läuft deshalb über mehrere Schritte. Batterie und V2G reagieren im Spiel ohne diese mechanische Rampe. Energie- und Kapazitätsgrenzen erzwingen bei Bedarf einen Schutzstopp. Geladen wird nur aus tatsächlich verfügbarem Überschuss. Erneuerbare Anteile werden im Speicher mitgeführt.</p><p class="model-note"><strong>Bilanz:</strong> Erzeugung + Entladung = gedeckter Verbrauch + Ladung + Export + nicht abgefangener Überschuss. Speicherverluste entstehen zusätzlich innerhalb der Speicher. Fehlender Strom wird als ungedeckter Bedarf bilanziert. Erneuerbare dürfen im Spiel nur mit maximal 3 MW pro Runde  abgeregelt werden.  </p><p class="model-note"><strong>Emissionen, vereinfachte Modellfaktoren:</strong> Gas 0,42 · Kohle 0,90 · Biomasse 0,08 · Importenergie (hier Kernenergie) 0,015 t CO₂e/MWh; PV/Wind/Wasser 0 im Spiel. Diese Spielwerte sind kein vollständiger Lebenszyklusvergleich. Emissionen werden bei der Erzeugung gezählt, beim Entladen nicht erneut. Biomasse ist erneuerbar, aber nicht emissionsfrei.</p><p class="model-note"><strong>Kosten:</strong> Erneuerbare 15, Biomasse 65, Gas 125, Kohle 165, Import 225 €/MWh. Kosten sind ein Ergebniswert, kein zusätzliches Punktelimit. Gas und Kohle besitzen je Szenario unterschiedliche Energiebudgets.</p><p class="model-note"><strong>Punkte:</strong> 500 × Versorgung (1 minus vierfacher ungedeckter Anteil minus ¼ des Überschussanteils); 350 × Klima (65 % erneuerbarer Versorgungsanteil + 35 % vermiedene Emissionen gegenüber 0,9 t/MWh); 150 × Speicherstrategie (45 % Ladeeffizienz, 35 % Überschussnutzung, 20 % Versorgung). Jeweils auf 0–100 % begrenzt. Ungedeckter Strombedarf wird stärker bestraft als ein notwendiger Reserveeinsatz.</p><p class="model-note"><strong>Ganze MW:</strong> Wetterangebot, Bedarf, Freigabe, Kraftwerksleistung und Speicherfluss werden im Spiel auf ganze MW begrenzt. MWh-Speicherstände bleiben wegen der Wirkungsgrade präzise; nutzbare Restleistung unter 1 MW wird nicht aufgerundet.</p><p class="model-note"><strong>Stromexport:</strong> Maximal 4 MW Anschlussleistung. Verbrauch und Speicherladung haben Vorrang. Nur danach verbleibender Überschuss kann für 60 €/MWh verkauft werden. Erlöse werden separat und im Kostensaldo gezeigt; sie erzeugen keine kostenlosen Klimapunkte.</p><p class="model-note"><strong>Importenergie:</strong> Das ☢-Symbol kennzeichnet die vereinfachte Modellannahme eines Kernenergiebezugs. Realer Importstrom hat einen wechselnden Erzeugungsmix; das Spiel behauptet keinen realen Importmix für Freistadt.</p><p class="model-note"><strong>Abregelung:</strong> Technisch möglich; hier als zentrale Spielsteuerung vereinfacht und auf 3 MW pro Runde beschränkt. V2G funktioniert nach Freischaltung wie ein Batteriespeicher mit 20 MWh und ±4 MW. <a href="https://energiegemeinschaften.gv.at/flexibilitaeten/" target="_blank" rel="noopener">Offizielle Erläuterung zu Flexibilität und Einspeisebegrenzung</a>.</p><p class="model-note"><strong>Wetter:</strong> Fiktive Wetter- und Ereignisszenarien; jeder Tagesverlauf ist mit seiner Wetter-ID reproduzierbar. Ein neues Spiel zieht eine Wetter-ID, „Noch einmal“ wiederholt dieselbe. Prognosen weichen bei Wind um bis zu 6,5 Prozentpunkte und bei PV um bis zu 10 % ab. Speicherausbau und PV-Investitionen verändern die verfügbaren Kapazitäten. Die lokale Bestenliste zeigt Szenario und Ausbau getrennt.</p>`);}
function arcadeScores(){return `<div class="arcade-board"><span class="fiction-label">ARCADE · FIKTIVE REKORDE</span>${[['SOLAR-PANDA',986],['AKKU-OTTER',942],['WIND-WOMBAT',905],['WASSER-WIESEL',872],['BIO-BIBER',844]].map(([name,points],i)=>`<div class="arcade-row"><span>${String(i+1).padStart(2,'0')}</span><strong>${name}</strong><b>${points}</b></div>`).join('')}</div>`;}
function board(){const list=storage.get('board',[]);modal(`<h2 id="modal-title">Bestenliste</h2>${arcadeScores()}<h3 class="real-board-title">DEINE REKORDE</h3>${list.length?`<table class="board-table"><thead><tr><th>Name</th><th>Szenario / Ausbau</th><th>Punkte</th></tr></thead><tbody>${list.slice(0,20).map((e,i)=>`<tr><td>${i+1}. ${escape(e.name)}</td><td>${escape(e.mode)}<br><small>${e.upgraded?'Mit Ausbau':'Basisnetz'} · ${e.seed?'Wetter '+e.seed:'V1-Spiel'}</small></td><td>${e.points}</td></tr>`).join('')}</tbody></table>`:'<div class="event-option" style="margin-top:16px"><strong>Noch keine Einträge.</strong><small></small></div>'}<button class="secondary" data-action="close" style="margin-top:20px">Zurück zum Netzspiel</button>`);}
function resultsPage(){stopRealtime();screen='result';const sc=score(state);if(state.scenario.id>0&&sc.deficit<.1&&!profile.won.includes(state.scenario.id)){profile.won.push(state.scenario.id);profile.credits+=3;storage.set('profile',profile);}const title=sc.points>=900?'Du bist ein Energiegenie.':sc.points>=700?'Gut geplant. Gut versorgt.':sc.points>=450?'Jeder Tag macht dich besser.':'Morgen ist ein neuer Energietag.';const awards=[];if(sc.deficit<.1)awards.push('Netzretter:in');if(sc.fossil<.1)awards.push('Fossilfrei durch die Nacht');if(sc.charged>40&&sc.deficit<3)awards.push('Speicherprofi');if(sc.renewPercent>85)awards.push('Windflüstern im Griff');if(sc.points>=900)awards.push('Energiegenie');
 app.innerHTML=`<div class="shell">${header()}<main><div class="gamehead"><div><div class="eyebrow">DEIN TAG IST GESCHAFFT</div><h1>${state.scenario.name} · Tagesauswertung</h1><p>Deine Entscheidungen haben einen Unterschied gemacht.</p></div><button class="secondary" data-action="restart">Noch einmal ↻</button></div><div class="result-world"><div><section class="score-card"><div class="tiny" style="color:#b6c6ae">DEINE NETZSPIEL-PUNKTE</div><div class="score-number">${sc.points}<span> / 1.000</span></div><div class="stars" aria-label="${sc.stars} von 3 Sternen">${'★'.repeat(sc.stars)}${'☆'.repeat(3-sc.stars)}</div><h1>${title}</h1><div class="score-breakdown">${[['Versorgungssicherheit',sc.security,500],['Klimafreundlichkeit',sc.climate,350],['Strategie & Speicher',sc.strategy,150]].map(([n,v,m])=>`<div><div class="score-row"><span>${n}</span><strong>${v} / ${m}</strong></div><div class="score-bar"><i style="width:${v/m*100}%"></i></div></div>`).join('')}</div></section><div class="result-stats">${[[fmt(sc.renewPercent,0)+' %','Erneuerbare an gedecktem Bedarf'],[fmt(sc.deficit)+' MWh','Nicht gedeckter Strombedarf'],[fmt(sc.fossil)+' MWh','Fossile Erzeugung'],[fmt(sc.carbon)+' t','CO₂e aus Erzeugung'],[fmt(sc.netCost,0)+' €','Kosten minus Exporterlös'],[fmt(sc.revenue,0)+' €','Einnahmen aus Stromexport'],[fmt(sc.exported,0)+' MWh','Stromexport'],[fmt(sc.loss)+' MWh','Speicherverluste']].map(([n,l])=>`<div class="result-stat"><strong>${n}</strong><small>${l}</small></div>`).join('')}</div><div>${awards.map(a=>`<span class="badge">✦ ${a}</span>`).join('')}</div><form id="save-score" class="save-score"><label for="player">Dein Name für die lokale Bestenliste</label><input id="player" name="player" maxlength="24" placeholder="z. B. Team Sonnenkraft" autocomplete="off" required><button class="primary" type="submit">Eintragen ↗</button></form></div><section class="insights"><h2>Was dein Tag erzählt.</h2><div class="world ${state.history.at(-1).h>=18?'dusk':''}" style="height:270px" id="replay-world">${worldFromRecord(state.history.at(-1))}</div><div class="replay"><label for="replay-range">Dein Tag als Zeitreise <span id="replay-time">${time(state.history.at(-1).h)}</span></label><input id="replay-range" type="range" min="0" max="${state.history.length-1}" value="${state.history.length-1}" aria-label="Stunde für Tagesrückblick wählen"><p id="replay-detail"></p><button class="textbtn" data-action="replay" style="font-size:10px;padding-bottom:0">▷ Tag abspielen</button></div>${[
 ['Sonne und Wind haben ihren eigenen Fahrplan.',`Dein erneuerbarer Versorgungsanteil: ${fmt(sc.renewPercent)} %. Das Wetterangebot war nicht regelbar. Du konntest es nutzen, speichern oder abregeln. ${fmt(sc.curtailed)} MWh wurden abgeregelt.`],
 ['Dein Pumpspeicherkraftwerk verschiebt Energie.',`Du hast ${fmt(sc.charged)} MWh in Speicher geladen. Beim Laden und Entladen gingen insgesamt ${fmt(sc.loss)} MWh verloren. Beim Ablassen erzeugt das Pumpspeicherkraftwerk Strom. Zuvor braucht es mehr Strom zum Hochpumpen, als es später zurückliefert. Es verschiebt Energie mit Verlusten.`],
 ['Ein guter Mix hält die Region am Laufen.',`${fmt(sc.deficit)} MWh blieben ungedeckt. ${sc.deficit<.1?'Die Region war jede Stunde versorgt.':'Schau im Rückblick, wann Strom gefehlt hat. Vor diesen Stunden lohnt sich ein höherer Speicherstand oder früheres Hochfahren der Biomasse.'} Gas und Kohle lieferten zusammen ${fmt(sc.fossil)} MWh.`],
 ['Versorgung und Klima gehören zusammen.',`Deine Erzeugung verursachte im vereinfachten Modell ${fmt(sc.carbon)} t CO₂e. Ein reiner Gas-Referenzbetrieb für denselben gedeckten Bedarf ergibt ${fmt(sc.reference)} t. Deine Differenz: ${fmt(Math.abs(sc.avoided))} t ${sc.avoided>=0?'weniger':'mehr'}. Startspeicher sind erneuerbar vorgeladen; der Vergleich berücksichtigt keine historische Beladung oder Kraftwerksinvestitionen.`]
 ].map(([t,p],i)=>`<details class="insight" ${i===0?'open':''}><summary>${t}</summary><p>${p}</p></details>`).join('')}<div style="display:flex;flex-wrap:wrap;gap:10px;margin:23px 0"><button class="primary" data-action="home">Nächsten Tag wählen ↗</button><button class="secondary" data-action="invest">Region ausbauen · ${profile.credits} Punkte</button></div></section></div></main><div style="height:30px"></div>${footer()}</div>`;showReplay(state.history.length-1);window.scrollTo({top:0,behavior:'instant'});}
function worldFromRecord(r){return scene({h:r.h,wind:r.w.windFactor,pv:r.pv,pump:r.stores.pump.energy/r.stores.pump.capacity,battery:r.stores.battery.energy/r.stores.battery.capacity,bio:r.output.bio,gas:r.output.gas,coal:r.output.coal,bad:r.deficit>1,cloud:r.w.cloud,interactive:false,flows:{wind:r.wind,renew:r.pv,hydro:r.hydro,bio:r.output.bio,gas:r.output.gas,coal:r.output.coal,nuclear:r.output.nuclear,pump:r.storageFlow.pump,battery:r.storageFlow.battery}});}
function showReplay(i){const r=state.history[i];if(!r)return;$('#replay-world').innerHTML=worldFromRecord(r);$('#replay-world').className=`world ${r.h<6||r.h>=21?'night':r.h>=18?'dusk':''}`;$('#replay-time').textContent=time(r.h);$('#replay-detail').textContent=`Bedarf ${fmt(r.demand)} MW · Angebot ${fmt(r.totalSupply)} MW · ${r.deficit>.05?fmt(r.deficit)+' MW fehlten':r.surplus>.05?fmt(r.surplus)+' MW Überschuss':'Versorgung gesichert'} · Speicher ${fmt(r.stores.pump.energy+r.stores.battery.energy)} MWh`;
}
function investments(){modal(`<div class="eyebrow">KLEINE INVESTITIONEN. GROSSE WIRKUNG.</div><h2 id="modal-title">Baue deine Region weiter.</h2><p>Für jedes erstmals ohne Stromdefizit abgeschlossene 24-Stunden-Szenario erhältst du 3 Ausbaupunkte. Investitionen gelten ab der nächsten Runde und verändern die Spielmechanik.</p><p style="margin:15px 0"><strong>Dein Budget: ${profile.credits} Ausbaupunkte</strong></p>${[
 ['battery','Batterie erweitern','+15 MWh Kapazität',2],['pump','Oberbecken vergrößern','+40 MWh Kapazität',3],['pv','Solardächer ergänzen','+20 % PV-Leistung',2]
 ].map(([k,n,d,c])=>`<div class="upgrade"><div><strong>${n}</strong><small>${d} · ${c} Punkte${profile.upgrades[k]?' · Bereits gebaut':''}</small></div><button data-upgrade="${k}" ${profile.credits<c||profile.upgrades[k]?'disabled':''}>Bauen ↗</button></div>`).join('')}<p class="model-note">Bestenlisten-Einträge zeigen an, ob ein Ausbau aktiv war. Ausbaupunkte werden nur einmal je Szenario vergeben.</p><button class="secondary" data-action="reset-upgrades" style="margin-top:16px">Zum Basisnetz zurückkehren</button>`);}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-plant]');if(!b)return;
 if(b.dataset.scenario!==undefined){selected=Number(b.dataset.scenario);startPage();return;}


 if(b.dataset.store){const k=b.dataset.store,mode=b.dataset.mode,bounds=plannedStorageBounds(k);if(mode==='charge'&&bounds.min>=0||mode==='discharge'&&bounds.max<=0)return;state.storeModes??={};const desired=Math.max(1,Math.abs(state.controls[k])||Math.min(6,STORE[k].power));state.controls[k]=mode==='stop'?0:mode==='charge'?-Math.min(-bounds.min,desired):Math.min(bounds.max,desired);state.controls=sanitizeControls(state);const actual=state.controls[k];state.storeModes[k]=actual<0?'charge':actual>0?'discharge':'stop';updateDashboard(k);return;}
 if(b.dataset.plant){const k=b.dataset.plant;if(k==='wind'||k==='hydro'){modal(`<div class="eyebrow">ERNEUERBARES ANGEBOT</div><h2 id="modal-title">${k==='wind'?'Der Wind macht den Fahrplan.':'Stetig, aber begrenzt.'}</h2><p>${k==='wind'?'Windstrom kannst du nicht nach Belieben hochregeln. Schau auf die Prognose und speichere Überschüsse. Die Drehgeschwindigkeit in der Landschaft folgt dem Windangebot.':'Laufwasser liefert im Spiel 7 MW, bei Dunkelflaute 5,5 MW. Das ist eine begrenzte Grundproduktion. Das Wasser lässt sich hier nicht für später zurückhalten.'}</p><button class="primary" data-action="close" style="margin-top:20px">Zurück zur Leitstelle ↗</button>`);return;}const el=$('#control-'+k);el?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});el?.classList.add('highlight');setTimeout(()=>el?.classList.remove('highlight'),1600);$('#range-'+k)?.focus({preventScroll:true});return;}
 if(b.dataset.event){const card=eventFor(state);if(card&&card.id===b.dataset.event){state=chooseEvent(state,card,b.dataset.choice);closeModal();save();gamePage();}return;}
 if(b.dataset.upgrade){const k=b.dataset.upgrade,c=k==='pump'?3:2;if(profile.credits>=c&&!profile.upgrades[k]){profile.credits-=c;profile.upgrades[k]=k==='pump'?40:k==='battery'?15:.2;storage.set('profile',profile);investments();}return;}
 switch(b.dataset.action){
 case 'start':begin();break;case 'tutorial':begin(0);break;case 'resume':if(saved){state=structuredClone(saved);gamePage();if(state.scenario.realtime)realtimeBriefing();}break;
 case 'home':if(screen==='game'){stopAuto();modal(`<div class="eyebrow">DEIN FAHRPLAN BLEIBT GESPEICHERT</div><h2 id="modal-title">Zur Szenarioauswahl?</h2><p>Du kannst diesen Tag über „Fortsetzen“ wieder aufnehmen, solange du keine neue Runde startest.</p><div class="hero-actions"><button class="primary" data-action="home-confirm">Zur Auswahl ↗</button><button class="secondary" data-action="close">Weiterspielen</button></div>`);}else startPage();break;
 case 'home-confirm':closeModal();startPage();break;case 'step':if(!state.scenario.realtime)step();break;case 'live-start':launchRealtime();break;case 'help':help();break;case 'map':mapDialog();break;case 'model':model();break;case 'curtail-info':curtailInfo();break;case 'board':board();break;case 'close':closeModal();break;case 'restart':begin(state.scenario.id,state.seed);break;
 case 'replay':if(replayTimer){stopReplay();b.textContent='▷ Tag abspielen';}else{let n=0;showReplay(n);$('#replay-range').value=n;b.textContent='Ⅱ Zeitreise pausieren';replayTimer=setInterval(()=>{n++;if(n>=state.history.length){stopReplay();b.textContent='▷ Tag abspielen';return;}showReplay(n);$('#replay-range').value=n;},850);}break;
 case 'invest':investments();break;case 'reset-upgrades':{const refund=Object.keys(profile.upgrades).reduce((a,k)=>a+(k==='pump'?3:2),0);profile.credits+=refund;profile.upgrades={};storage.set('profile',profile);investments();break;}
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.storagePower){const k=e.target.dataset.storagePower,mode=storageMode(k),b=plannedStorageBounds(k),requested=Math.round(Number(e.target.value)||0);state.controls[k]=mode==='charge'?-clamp(requested,Math.max(0,-b.max),-b.min):mode==='discharge'?clamp(requested,Math.max(0,b.min),b.max):0;normalizeStoragePlan();e.target.value=Math.abs(state.controls[k]);updateDashboard(k);}else if(e.target.dataset.control){state.controls[e.target.dataset.control]=Number(e.target.value);state.controls=sanitizeControls(state);e.target.value=state.controls[e.target.dataset.control];updateDashboard(e.target.dataset.control);}else if(e.target.id==='replay-range'){stopReplay();const b=$('[data-action="replay"]');if(b)b.textContent='▷ Tag abspielen';showReplay(Number(e.target.value));}});
document.addEventListener('submit',e=>{if(e.target.id==='save-score'){e.preventDefault();const name=$('#player').value.trim();if(!name)return;const rows=storage.get('board',[]),sc=score(state);rows.push({name:name.slice(0,24),points:sc.points,mode:state.scenario.name,upgraded:Object.keys(state.upgrades).length>0,seed:state.seed,version:2,date:new Date().toISOString()});rows.sort((a,b)=>b.points-a.points);if(storage.set('board',rows.slice(0,50))){e.target.innerHTML='<label>✓ Deine Punktzahl ist eingetragen.</label><button type="button" class="secondary" data-action="board">Bestenliste öffnen ↗</button>';}else e.target.insertAdjacentHTML('beforeend','<p class="notice">Der Browser erlaubt gerade keine lokale Speicherung.</p>');}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-plant]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(!dialogs.innerHTML)return;const close=dialogs.querySelector('[data-action="close"]');if(e.key==='Escape'&&close)closeModal();if(e.key==='Tab'){const list=[...dialogs.querySelectorAll('button:not(:disabled),input,select,a[href]')];if(!list.length)return;const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
startPage();

let windPhase=0,windLastFrame=null;
function advanceWindFrame(timestamp){
 const delta=windLastFrame===null?0:Math.min(.1,Math.max(0,(timestamp-windLastFrame)/1000));windLastFrame=timestamp;
 const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!reduced&&!document.hidden){
  const speed=screen==='game'&&state?conditions(state).windFactor:.55;
  windPhase=(windPhase+delta*(speed>.01?speed*135:0))%360;
  document.querySelectorAll('[data-wind-blade]').forEach(blade=>{
   const cx=Number(blade.dataset.hubX),cy=Number(blade.dataset.hubY),offset=Number(blade.dataset.bladeOffset);
   blade.setAttribute('points',windBladePoints(cx,cy,windPhase+offset));
  });
 }
 if(typeof requestAnimationFrame==='function')requestAnimationFrame(advanceWindFrame);
}
if(typeof requestAnimationFrame==='function')requestAnimationFrame(advanceWindFrame);
</script></body></html>
