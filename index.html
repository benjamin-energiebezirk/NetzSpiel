<body><div id="app"></div><div id="dialog-root"></div><script type="module">// Fiktives stündliches Inselnetz. Alle Werte sind Spielannahmen, keine regionalen Daten.
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const SCENARIOS=[
 {id:0,name:'Dein erster Tag',tag:'TUTORIAL',hours:6,start:12,wind:1,pv:1,demand:.8,gas:140,coal:35,desc:'Sechs Stunden. Kleine Schritte. Ein gutes Gefühl fürs Netz.',difficulty:'Zum Kennenlernen'},
 {id:1,name:'Ein ganz normaler Tag',tag:'LEVEL 02',hours:24,start:0,wind:1,pv:1,demand:1,gas:180,coal:60,desc:'Von der ersten Nacht bis zur Abendspitze. Jeder Speicher zählt.',difficulty:'Ausgewogen'},
 {id:2,name:'Die Dunkelflaute',tag:'LEVEL 03',hours:24,start:0,wind:.31,pv:.39,demand:1,gas:230,coal:70,desc:'Wenig Sonne, kaum Wind. Wie lange reichen deine Reserven?',difficulty:'Anspruchsvoll'},
 {id:3,name:'Die Energiewende-Challenge',tag:'LEVEL 04',hours:24,start:0,wind:1.18,pv:1.16,demand:1.16,gas:75,coal:30,desc:'Viel erneuerbare Energie. Große Spitzen. Kleine Fehlerreserven.',difficulty:'Für Netzmeister:innen'}
];
const PLANTS={bio:{name:'Biomasse',max:9,ramp:3,cost:65,co2:.08,renew:1},gas:{name:'Gasreserve',max:22,ramp:7,cost:125,co2:.42,renew:0},coal:{name:'Kohlereserve',max:10,ramp:3,cost:165,co2:.9,renew:0},nuclear:{name:'Atomstrom-Import',max:14,ramp:14,cost:225,co2:.015,renew:0}};
const STORE={pump:{name:'Pumpspeicher',capacity:95,power:19,eta:Math.sqrt(.78)},battery:{name:'Batterie',capacity:30,power:12,eta:Math.sqrt(.90)}};
const baseDemand=[23,22,21,21,23,28,35,40,38,35,34,35,36,34,32,33,36,42,48,46,40,34,29,25];
const windProfile=[.60,.66,.63,.58,.52,.45,.36,.32,.40,.52,.65,.79,.86,.77,.60,.44,.30,.20,.15,.21,.34,.43,.52,.56];
function conditions(s,offset=0,forecast=false){
 const n=s.turn+offset,h=(s.scenario.start+n)%24,seed=s.seed;
 const jitter=Math.sin(n*2.17+seed*1.31)*.055;
 let wind=clamp((windProfile[h]+jitter)*s.scenario.wind,0,1);
 let cloud=clamp(.24+.18*Math.sin(h*.65+seed)+.1*Math.cos(h*1.77),.06,.8);
 let solar=50*Math.max(0,Math.sin((h-6)/12*Math.PI))*(1-cloud)*s.scenario.pv;
 let demand=baseDemand[h]*s.scenario.demand;
 let event='';
 if(s.scenario.id!==0&&n>=9&&n<=11){wind*=.25;event='Windstille über der Alm';}
 if(s.scenario.id!==0&&n>=12&&n<=14){solar*=1.23;cloud*=.45;event='Sonnenfenster';}
 if(s.scenario.id!==0&&n>=18&&n<=20){demand+=s.choices.festival==='shift'?3:8;event='Das große Dorffest';}
 if(s.scenario.id>=2&&h<6){demand+=5;event='Kalte Winternacht';}
 if(s.scenario.id===3&&n>=15&&n<=16){wind=.65;cloud=.82;solar*=.4;event='Sturmabschaltung';}
 if(s.choices.solar==='shift'&&n>=12&&n<=14)demand+=3;
 if(s.choices.solar==='shift'&&n>=18&&n<=20)demand-=3;
 if(s.choices.festival==='shift'&&n>=17&&n<=18)demand+=7.5;
 const hydro=s.scenario.id===2?5.5:7;
 if(forecast&&offset>0){wind=clamp(wind+Math.sin(n+seed)*.065,0,1);solar=Math.max(0,solar*(1+Math.cos(n*1.8+seed)*.1));}
 return {h,wind:38*wind,windFactor:wind,pv:Math.max(0,solar),hydro,demand,cloud,event,cold:s.scenario.id>=2&&h<6};
}
function newGame(id=1,seed=17,upgrades={}){
 const scenario={...SCENARIOS[id]};const stores={};
 for(const [k,v] of Object.entries(STORE)){const cap=v.capacity+(upgrades[k]||0);stores[k]={energy:cap*.6,capacity:cap,renew:cap*.6,carbon:0};}
 return {version:1,scenario,seed,turn:0,stores,previous:{bio:3,gas:0,coal:0,nuclear:0},fuel:{gas:scenario.gas,coal:scenario.coal,nuclear:115},controls:{bio:3,gas:0,coal:0,nuclear:0,pump:0,battery:0,renew:100,curtail:true,v2g:0},history:[],choices:{},eventsSeen:[],v2g:false,v2gEnergy:12,upgrades,done:false};
}
function eventFor(s){
 if(s.scenario.id===0)return null;
 const cards={
 6:{id:'v2g',title:'Die Autos können mehr.',label:'FLEXIBILITÄT',text:'Die Gemeinde erlaubt Vehicle-to-Grid. Freiwillige stellen 12 MWh bereit, maximal 4 MW. Diese Energie wurde zuvor erneuerbar geladen.',options:[{value:'yes',title:'V2G freischalten',detail:'Zusätzlicher Regler für die Abendspitze.'},{value:'no',title:'Ohne Fahrzeugreserve',detail:'Die Autos bleiben beim Laden.'}]},
 9:{id:'calm',title:'Windstille über der Alm!',label:'WETTERFRONT',text:'Von 09 bis 12 Uhr sinkt die Windleistung auf ein Viertel. Die Wetterlage gilt für beide Entscheidungen.',options:[{value:'save',title:'Speicher schonen',detail:'Speicherregler werden auf Stillstand gesetzt.'},{value:'keep',title:'Fahrplan beibehalten',detail:'Deine Einstellungen bleiben bestehen.'}]},
 12:{id:'solar',title:'Ein Fenster voller Sonne.',label:'SONNENFENSTER',text:'Drei Stunden bringen 23 % mehr Solarstrom. Betriebe könnten ihre Kühlung vorziehen und damit die Abendlast senken.',options:[{value:'shift',title:'Verbrauch vorziehen',detail:'Mittags +3 MW, am Abend −3 MW.'},{value:'keep',title:'Strom zum Speichern nutzen',detail:'Der Lastverlauf bleibt unverändert.'}]},
 17:{id:'festival',title:'Heute tanzt das Dorf.',label:'ABENDSPITZE',text:'Das Dorffest braucht von 18 bis 21 Uhr zusätzliche 8 MW. Mit flexiblen Standbetreiber:innen lässt sich ein Teil vorziehen.',options:[{value:'shift',title:'Lasten gemeinsam verschieben',detail:'17 Uhr: +7,5 MW; 18 Uhr: +10,5 MW; 19 und 20 Uhr: nur +3 MW. Gleiche Energiemenge.'},{value:'keep',title:'Fest wie geplant versorgen',detail:'18, 19 und 20 Uhr: je +8 MW.'}]}
 };
 const card=cards[s.turn];return card&&!s.eventsSeen.includes(card.id)?card:null;
}
function chooseEvent(s,card,value){const next=structuredClone(s);next.eventsSeen.push(card.id);next.choices[card.id]=value;if(card.id==='v2g'&&value==='yes')next.v2g=true;if(card.id==='calm'&&value==='save'){next.controls.pump=0;next.controls.battery=0;}return next;}
function simulate(s,controls=s.controls){
 const next=structuredClone(s),c={...s.controls,...controls};next.controls=c;
 const w=conditions(s);let demand=w.demand,renewAvailable=(w.pv*(1+(s.upgrades.pv||0))+w.wind+w.hydro),renew=renewAvailable*clamp(c.renew/100,0,1);
 const output={},notes=[];let cost=0,carbon=0,fossil=0,totalRenew=renew,totalSupply=renew;
 for(const [k,p] of Object.entries(PLANTS)){
  const target=clamp(Number(c[k])||0,0,p.max);let actual=clamp(target,Math.max(0,s.previous[k]-p.ramp),Math.min(p.max,s.previous[k]+p.ramp));
  if(k!=='bio')actual=Math.min(actual,s.fuel[k]);
  if(Math.abs(target-actual)>.05)notes.push(p.name+': Leistung durch Rampe oder Reserve begrenzt.');
  output[k]=actual;next.previous[k]=actual;if(k!=='bio')next.fuel[k]-=actual;
  cost+=actual*p.cost;carbon+=actual*p.co2;totalSupply+=actual;totalRenew+=actual*p.renew;if(k==='gas'||k==='coal')fossil+=actual;
 }
 let storageLoss=0,discharged=0,charged=0;
 const storageFlow={},storageBefore={};
 for(const [k,p] of Object.entries(STORE)){
  const a=next.stores[k];storageBefore[k]=a.energy;const request=clamp(Number(c[k])||0,-p.power,p.power);storageFlow[k]=0;
  if(request>0){const actual=Math.min(request,a.energy*p.eta);const internal=actual/p.eta;const fraction=a.energy>0?a.renew/a.energy:0;
   totalRenew+=actual*fraction;totalSupply+=actual;discharged+=actual;storageLoss+=internal-actual;a.renew=Math.max(0,a.renew-internal*fraction);a.energy=Math.max(0,a.energy-internal);storageFlow[k]=actual;
  }
 }
 const v2g=s.v2g?Math.min(clamp(c.v2g||0,0,4),s.v2gEnergy):0;next.v2gEnergy-=v2g;totalSupply+=v2g;totalRenew+=v2g;discharged+=v2g;
 const served=Math.min(demand,totalSupply),renewFraction=totalSupply?totalRenew/totalSupply:0;let surplus=Math.max(0,totalSupply-demand);
 for(const [k,p] of Object.entries(STORE)){
  const a=next.stores[k],request=clamp(Number(c[k])||0,-p.power,p.power);
  if(request<0){const actual=Math.min(-request,surplus,(a.capacity-a.energy)/p.eta);a.energy+=actual*p.eta;a.renew+=actual*p.eta*renewFraction;surplus-=actual;charged+=actual;storageLoss+=actual*(1-p.eta);storageFlow[k]=-actual;
   if(actual+.05<-request)notes.push(p.name+': Laden auf Überschuss und freien Platz begrenzt.');
  }
 }
 let curtail=renewAvailable-renew;
 if(c.curtail){const cut=Math.min(surplus,renew);renew-=cut;surplus-=cut;totalSupply-=cut;totalRenew-=cut;curtail+=cut;}
 // After curtailment, demand and storage receive the proportional remaining mix.
 const finalRenewFraction=totalSupply?clamp(totalRenew/totalSupply,0,1):0;
 // Correct the previously assigned charging mix to the final bus mix.
 for(const [k,p] of Object.entries(STORE)){if(storageFlow[k]<0){next.stores[k].renew+=(-storageFlow[k])*p.eta*(finalRenewFraction-renewFraction);next.stores[k].renew=clamp(next.stores[k].renew,0,next.stores[k].energy);}}
 cost+=renew*15;
 const deficit=Math.max(0,demand-totalSupply),balance=totalSupply-demand-charged;
 const record={turn:s.turn,h:w.h,w,demand,served,deficit,surplus,balance,output,renew,renewAvailable,pv:w.pv*(1+(s.upgrades.pv||0))*clamp(c.renew/100,0,1),wind:w.wind*clamp(c.renew/100,0,1),hydro:w.hydro*clamp(c.renew/100,0,1),totalSupply,renewServed:served*finalRenewFraction,fossil,carbon,cost,curtail,charged,discharged,storageLoss,storageFlow,storageBefore,stores:structuredClone(next.stores),v2g,notes,controls:{...c}};
 next.history.push(record);next.turn++;next.done=next.turn>=s.scenario.hours;
 return {next,record};
}
function score(s){
 const sum=k=>s.history.reduce((a,r)=>a+(r[k]||0),0),demand=sum('demand'),served=sum('served'),renew=sum('renewServed'),carbon=sum('carbon'),surplus=sum('surplus');
 const security=demand?clamp(1-4*(1-served/demand)-surplus/demand*.25,0,1):0;
 const climate=served?clamp(.65*renew/served+.35*(1-carbon/(served*.9)),0,1):0;
 const captured=sum('charged'),curtailed=sum('curtail'),loss=sum('storageLoss');
 const storage=clamp(.45*(captured?1-loss/captured:1)+.35*(captured+curtailed?captured/(captured+curtailed):1)+.20*security,0,1);
 const points=Math.round(500*security+350*climate+150*storage);
 return {points,security:Math.round(500*security),climate:Math.round(350*climate),strategy:Math.round(150*storage),stars:points>=900?3:points>=700?2:points>=450?1:0,renewPercent:served?100*renew/served:0,deficit:sum('deficit'),fossil:sum('fossil'),carbon,cost:sum('cost'),demand,served,charged:captured,loss,curtailed,reference:served*.42,avoided:served*.42-carbon};
}

function scene({h=13,wind=.55,pv=30,pump=.6,battery=.6,bio=3,gas=0,coal=0,bad=false,cloud=.25,interactive=true}={}){
 const night=h<6||h>=21,dusk=h>=18&&h<21||h===6;

const $=s=>document.querySelector(s),app=$('#app'),dialogs=$('#dialog-root');
const fmt=(n,d=1)=>Number(n).toLocaleString('de-AT',{minimumFractionDigits:d,maximumFractionDigits:d});

const storage={get(k,f){try{return JSON.parse(localStorage.getItem('netzmeister-'+k))??f;}catch{return f;}},set(k,v){try{localStorage.setItem('netzmeister-'+k,JSON.stringify(v));return true;}catch{return false;}}};

function startPage(){stopAuto();stopReplay();screen='start';app.innerHTML=`<div class="shell">${header()}<main class="start"><section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> Willkommen in deiner Netzleitstelle</div><h1>Kleine Region.<br>Große Energie.<br><em>Dein Zug.</em></h1><p>24 Stunden. Wechselndes Wetter. Tausende Haushalte. Halte das Netz am Laufen – mit Köpfchen, Wind und einer guten Portion Wasserkraft.</p><div class="hero-actions"><button class="primary" data-action="start">Spiel starten <span>↗</span></button>${saved?'<button class="secondary" data-action="resume">Fortsetzen ↻</button>':'<button class="textbtn" data-action="tutorial">Erst mal ausprobieren →</button>'}</div><div class="hero-foot"><span>Direkt im Browser</span><span>Ohne Anmeldung</span><span>Deine Entscheidungen zählen</span></div></div><div class="hero-world"><div class="world">${scene({interactive:false})}</div><div class="float-tag solar"><span class="tiny" style="font-size:8px;color:var(--muted)">Gute Aussichten</span><strong>☀ Viel Sonne. Viel Potenzial.</strong></div><div class="float-tag status"><span class="tag-symbol">ϟ</span><div><strong>Das Netz wartet auf dich.</strong><small>Erzeugen. Speichern. Weiterdenken.</small></div></div></div></section><section class="scenario-section"><div class="sectionline"><h2>Welchen Tag meisterst du?</h2><p>Wähle dein Szenario. Dann übernimm die Leitstelle.</p></div><div class="scenarios">${SCENARIOS.map((s,i)=>`<button class="scenario ${selected===i?'selected':''}" data-scenario="${i}" aria-pressed="${selected===i}"><span class="tiny">${s.tag}</span><span class="scenario-icon">${['☀','↗','☁','ϟ'][i]}</span><h3>${s.name}</h3><p>${s.desc}</p><div class="scenario-bottom"><span>${s.hours} Spielzüge · ${s.difficulty}</span><span>${selected===i?'●':'↗'}</span></div></button>`).join('')}</div></section></main>${footer()}</div>`;}
function begin(id=selected){state=newGame(id,17,profile.upgrades);save();gamePage();}
function stopAuto(){if(auto)clearInterval(auto);auto=null;const b=$('[data-action="auto"]');if(b)b.textContent='▷ Automatisch';}
function stopReplay(){if(replayTimer)clearInterval(replayTimer);replayTimer=null;}
function hint(r){if(state.scenario.id===0)return [
 'Willkommen! Die Sonne liefert viel Strom. Stelle den Pumpspeicher auf „Laden“ und beobachte die Bilanz.',
 'Gespeicherte Energie hilft später. Beim Laden entstehen Verluste; 1 MWh im Netz wird nicht zu 1 MWh im Speicher.',
 'Ein Schritt ist eine Stunde. MW beschreiben Leistung, MWh die Energie dieser Stunde.',
 'Die Sonne wandert weiter. Die Vorschau rechts und die Prognose helfen dir beim Planen.',
 'Am Abend steigt der Verbrauch. Mit Entladen holst du gespeicherte Energie zurück ins Netz.',
 'Dein letzter Zug: Nutze Speicher und Biomasse. Versorgungssicherheit zählt am meisten.'
 ][state.turn];
 if(r.deficit>1)return `Es fehlen ${fmt(r.deficit)} MW. Speicher entladen oder Reserven erhöhen, bevor du die Stunde bestätigst.`;
 if(r.surplus>1)return `${fmt(r.surplus)} MW bleiben ungenutzt im Netz. Regelbare Kraftwerke reduzieren oder Speicher laden.`;
 if(r.curtail>3)return `Erneuerbare Energie im Überfluss: ${fmt(r.curtail)} MW werden abgeregelt. Ist noch Platz in deinen Speichern?`;
 if(r.w.h>=16&&r.w.h<=19)return 'Der Abend kommt. Weniger Sonne, mehr Verbrauch: Jetzt zeigt sich der Wert deiner Speicher.';
 if(r.charged>1)return `Guter Zeitpunkt zum Laden. ${fmt(r.charged)} MWh wandern diese Stunde in deine Speicher – vor Verlusten.`;
 if(r.output.gas>1||r.output.coal>1)return 'Reserve ist manchmal notwendig. Jede vermiedene Ausfallstunde zählt mehr als ein perfekter Energiemix.';
 return 'Die Bilanz sieht gut aus. Behalte den Wetterbericht und die nächste Verbrauchsspitze im Blick.';}
function storeControl(k,r){const p=STORE[k],a=state.stores[k],v=state.controls[k];return `<section class="control-group" id="control-${k}"><label class="control-label" for="range-${k}"><span><span class="plant-icon">${icons[k]}</span>${p.name}</span><output id="out-${k}">${v<0?'−':v>0?'+':''}${fmt(Math.abs(v),0)} MW</output></label><div class="control-detail"><span id="energy-${k}">${fmt(a.energy)} / ${fmt(a.capacity,0)} MWh</span> · ${Math.round(p.eta*p.eta*100)} % Zykluswirkungsgrad</div><div class="meter"><i style="width:${a.energy/a.capacity*100}%"></i></div><div class="store-modes"><button data-store="${k}" data-mode="charge" class="${v<0?'active':''}">↓ Laden</button><button data-store="${k}" data-mode="stop" class="${v===0?'active':''}">Stillstand</button><button data-store="${k}" data-mode="discharge" class="${v>0?'active':''}">↑ Entladen</button></div><input id="range-${k}" data-control="${k}" type="range" min="-${p.power}" max="${p.power}" step="1" value="${v}" aria-label="${p.name}: negative Leistung lädt, positive entlädt"><div class="control-sub"><span>−${p.power} MW laden</span><span>+${p.power} MW entladen</span></div><div id="actual-${k}" class="control-detail">Tatsächlich: ${flowLabel(r.storageFlow[k])}</div></section>`;}
const flowLabel=v=>Math.abs(v)<.05?'Stillstand':`${v<0?'Laden':'Entladen'} mit ${fmt(Math.abs(v))} MW`;
function plantControl(k,r){const p=PLANTS[k];return `<section class="control-group ${k==='bio'?'':'reserve'}" id="control-${k}"><label class="control-label" for="range-${k}"><span><span class="plant-icon">${icons[k]}</span>${p.name}</span><output id="out-${k}">${fmt(state.controls[k],0)} MW</output></label><input id="range-${k}" data-control="${k}" type="range" min="0" max="${p.max}" step="1" value="${state.controls[k]}" aria-label="${p.name} Sollleistung"><div class="control-detail" id="actual-${k}">Ist: ${fmt(r.output[k])} MW · Rampe ${p.ramp} MW/h${k!=='bio'?`<br>Reserve: ${fmt(state.fuel[k],0)} MWh · ${p.cost} €/MWh`:'<br>Regional regelbar · 65 €/MWh'}</div></section>`;}
function gamePage(){screen='game';const r=simulate(state).record,w=r.w;app.innerHTML=`<div class="shell">${header()}<main><div class="gamehead"><div><div class="eyebrow" style="font-size:8px">${state.scenario.tag} · DEINE NETZLEITSTELLE</div><h1>${state.scenario.name}</h1><p>Stunde ${state.turn+1} von ${state.scenario.hours} · Stelle deinen Fahrplan ein und bestätige die nächste Stunde.</p></div><div class="timeblock"><div class="clock">${time(w.h)}</div><span class="weatherpill">${state.turn?score(state).points:0} Punkte</span><span class="weatherpill">${weatherLabel(w)}</span><button class="secondary" data-action="pause">Ⅱ Pause</button></div></div>${state.scenario.id===0?`<aside class="tutorial"><span class="tutorial-number">${state.turn+1}</span><div><strong>${['Erst erzeugen, dann speichern','Ein Speicher ist kein Kraftwerk','Leistung und Energie','Vorausschauend planen','Der Abend braucht Reserven','Du hast die Leitstelle im Griff'][state.turn]}</strong><p>${hint(r)}</p></div></aside>`:''}<div class="game-grid"><div class="stage-column"><div id="game-world" class="world game-world"></div><div id="balance" class="balance" aria-live="polite"></div><section class="timeline"><div class="timeline-top"><h3>Dein Tag im Netz <span style="color:var(--muted);font-weight:400">· MW</span></h3><div class="legend"><span><i style="background:#78a378"></i>Erneuerbar</span><span><i style="background:#174ded"></i>Bedarf</span><span>┄ Prognose</span></div></div><div id="chart"></div><div class="control-detail">Nächste Stunden · Wetterprognose mit kleiner Unsicherheit · Sonne / Wind / Bedarf in MW</div><div id="forecast" class="forecast"></div></section></div><aside class="controls" aria-label="Kraftwerkssteuerung"><div class="control-title"><h2>Dein Energiemix</h2><span>FAHRPLAN IN MW</span></div><div class="control-scroll"><section class="control-group renew" id="control-renew"><label class="control-label" for="range-renew"><span><span class="plant-icon">☀</span>Erneuerbare</span><output id="out-renew">${fmt(r.renewAvailable)} MW</output></label><div id="renew-values" class="control-detail"></div><input id="range-renew" data-control="renew" type="range" min="0" max="100" step="5" value="${state.controls.renew}" aria-label="Freigabe erneuerbarer Erzeugung in Prozent"><div class="control-sub"><span>Erzeugung freigeben</span><span id="renew-percent">${state.controls.renew} %</span></div><label class="toggle-row">Überschuss automatisch abregeln<input id="curtail" type="checkbox" ${state.controls.curtail?'checked':''}></label></section>${storeControl('pump',r)}${storeControl('battery',r)}${plantControl('bio',r)}${plantControl('gas',r)}${plantControl('coal',r)}${plantControl('nuclear',r)}${state.v2g?`<section class="control-group" id="control-v2g"><label class="control-label" for="range-v2g"><span>↔ Vehicle-to-Grid</span><output id="out-v2g">${state.controls.v2g} MW</output></label><input id="range-v2g" type="range" min="0" max="4" value="${state.controls.v2g}" step="1" data-control="v2g"><div class="control-detail">Fahrzeugreserve: ${fmt(state.v2gEnergy)} MWh · erneuerbar vorgeladen</div></section>`:''}</div><div class="control-actions"><button class="primary" data-action="step">Stunde bestätigen <span>${time(w.h)} → ${time((w.h+1)%24)}</span></button><div class="action-row"><button data-action="auto">${auto?'Ⅱ Auto pausieren':'▷ Automatisch'}</button><span>1 Zug = 1 Stunde</span></div></div></aside></div><div class="gamebottom"><span id="cumulative"></span><span>MW = Leistung · MWh = Energie · <button class="textbtn" data-action="model" style="font-size:10px;padding:0">Spielmodell ansehen ↗</button></span></div></main>${footer()}</div>`;updateDashboard();}

 const issue=r.deficit>.05?r.deficit:r.surplus;const status=issue>2?'badtext':issue>.05?'warn':'good';const label=r.deficit>.05?'Strom fehlt':r.surplus>.05?'Zu viel im Netz':'Netz im Gleichgewicht';

 if($('#out-v2g'))$('#out-v2g').textContent=state.controls.v2g+' MW';
 $('#chart').innerHTML=chart(state);
 $('#forecast').innerHTML=Array.from({length:Math.min(6,state.scenario.hours-state.turn-1)},(_,i)=>{const f=conditions(state,i+1,true);return `<div class="forecast-cell"><b>${time(f.h)}</b><span>${f.h<6||f.h>=21?'☾':f.cloud>.5?'☁':'☀'}</span><div class="forecast-values">${fmt(f.pv*(1+(state.upgrades.pv||0)),0)} / ${fmt(f.wind,0)} / ${fmt(f.demand,0)}</div></div>`;}).join('')||'<div class="control-detail">Letzter Zug dieses Tages.</div>';
 const sc=score(state);$('#cumulative').textContent=`Bisher: ${fmt(sc.cost,0)} € · ${fmt(sc.carbon)} t CO₂e · ${fmt(sc.deficit)} MWh ungedeckt · ¹ nach Entladeverlusten`;
 save();}
function chart(s){const width=720,height=95,max=100,left=8,right=710,range=Math.max(1,s.scenario.hours-1),x=n=>left+n/range*(right-left),y=v=>76-Math.min(max,v)/max*64;let lines='',area='',forecast='';
 const data=Array.from({length:s.scenario.hours},(_,i)=>{const rec=s.history[i];const w=conditions({...s,turn:i},0,i>=s.turn);return {i,d:rec?rec.demand:w.demand,r:rec?rec.renew+rec.output.bio:w.pv*(1+(s.upgrades.pv||0))+w.wind+w.hydro+Number(s.controls.bio)};});
 for(let i=0;i<data.length;i++){const a=data[i];if(i<=s.turn)lines+=`${i?'L':'M'}${x(i)},${y(a.d)} `;if(i>=s.turn)forecast+=`${i===s.turn?'M':'L'}${x(i)},${y(a.d)} `;area+=`${i?'L':'M'}${x(i)},${y(a.r)} `;}
 return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Tagesverlauf: erneuerbares Angebot und Strombedarf in Megawatt"><path d="M8 76H710M8 44H710M8 12H710" stroke="#dce3d3" stroke-width=".6"/><path d="${area}L710 76H8Z" fill="#91b587" opacity=".24"/><path d="${area}" fill="none" stroke="#7b9f70" stroke-width="1.7"/><path d="${lines}" stroke="#174ded" fill="none" stroke-width="2.5"/><path d="${forecast}" stroke="#174ded" fill="none" stroke-dasharray="4 4" stroke-width="1.8"/><path d="M${x(Math.min(s.turn,s.scenario.hours-1))} 3v74" stroke="#174ded" opacity=".4"/><circle cx="${x(Math.min(s.turn,s.scenario.hours-1))}" cy="${y(data[Math.min(s.turn,data.length-1)].d)}" r="4" fill="#174ded"/>${[0,Math.floor(range/3),Math.floor(2*range/3),range].map(i=>`<text x="${x(i)}" y="92" font-size="9" fill="#7d8c7e" text-anchor="${i===0?'start':i===range?'end':'middle'}">${time((s.scenario.start+i)%24)}</text>`).join('')}<text x="2" y="9" font-size="7" fill="#8e9c90">100</text></svg>`;
}
function step(){if(screen!=='game'||state.done)return;const event=eventFor(state);if(event){stopAuto();showEvent(event);return;}const result=simulate(state);state=result.next;save();if(state.done){stopAuto();resultsPage();}else gamePage();}
function modal(html,closable=true){modalReturn=document.activeElement;dialogs.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${closable?'<button class="close" data-action="close" aria-label="Dialog schließen" style="float:right">×</button>':''}${html}</section></div>`;dialogs.querySelector('button,input,select')?.focus();}
function closeModal(){dialogs.innerHTML='';modalReturn?.focus();}
function showEvent(e){modal(`<div class="eyebrow">✦ ${e.label}</div><h2 id="modal-title">${e.title}</h2><p>${e.text}</p><div class="event-options">${e.options.map(o=>`<button class="event-option" data-event="${e.id}" data-choice="${o.value}"><strong>${o.title} ↗</strong><small>${o.detail}</small></button>`).join('')}</div>`,false);}
function help(){stopAuto();modal(`<div class="eyebrow">DEINE ERSTEN FÜNF MINUTEN</div><h2 id="modal-title">Ein guter Tag beginnt<br>mit einer guten Bilanz.</h2><div class="event-options"><div class="event-option"><strong>01 · Schau aufs Angebot.</strong><small>Sonne, Wind und Laufwasser liefern wetterabhängig Strom. Die nächsten Stunden siehst du unter der Landschaft.</small></div><div class="event-option"><strong>02 · Stelle deinen Fahrplan ein.</strong><small>Bei Überschuss Speicher laden. Bei Mangel entladen oder regelbare Kraftwerke erhöhen. Die Bilanz zeigt bereits die Folgen deiner Einstellungen.</small></div><div class="event-option"><strong>03 · Bestätige die Stunde.</strong><small>Jeder Zug dauert eine Modellstunde. Regler legen Sollleistungen fest; Rampen, Wetter, Reserven und Speicher begrenzen die tatsächliche Leistung.</small></div><div class="event-option"><strong>04 · Denke an später.</strong><small>Die Abendspitze kommt, wenn die Sonne verschwindet. Ein notwendiger Reserveeinsatz ist besser als ein Stromausfall.</small></div></div><p class="model-note">Automatik bestätigt alle 6 Sekunden den aktuellen Fahrplan. Du kannst jederzeit pausieren. Ereigniskarten halten die Automatik an. Ton ist für das Spiel nicht erforderlich.</p><button class="primary" data-action="close" style="margin-top:20px">Verstanden. Los geht’s. ↗</button>`);}
function model(){stopAuto();modal(`<div class="eyebrow">TRANSPARENTES SPIELMODELL · VERSION 1.0</div><h2 id="modal-title">Spielerisch. Aber mit Bilanz.</h2><p>Eine fiktive österreichische Region als stündlich bilanziertes Inselnetz. Keine realen Netzdaten der Mühlviertler Alm und keine Simulation der Netzfrequenz. Alle Zahlen sind eigens gesetzte Spielannahmen.</p><table class="model-table"><thead><tr><th>Anlage</th><th>Leistung</th><th>Modell-Eigenschaft</th></tr></thead><tbody><tr><td>PV / Wind / Laufwasser</td><td>50 / 38 / 7 MW</td><td>Wetterabhängig; Wasser 5,5 MW in Dunkelflaute</td></tr><tr><td>Pumpspeicher</td><td>±19 MW · 95 MWh</td><td>78 % pro Lade-/Entladezyklus</td></tr><tr><td>Batterie</td><td>±12 MW · 30 MWh</td><td>90 % pro Zyklus</td></tr><tr><td>Biomasse</td><td>9 MW</td><td>Rampe 3 MW/h</td></tr><tr><td>Gas / Kohle</td><td>22 / 10 MW</td><td>Rampe 7 / 3 MW/h; begrenzte Brennstoffreserve</td></tr><tr><td>Atomstrom-Import</td><td>14 MW</td><td>115 MWh je Runde; 225 €/MWh</td></tr></tbody></table><p class="model-note"><strong>Speicher:</strong> ΔE = Ladeleistung × η × 1 h − Entladeleistung ÷ η × 1 h. η ist die Wurzel des Zykluswirkungsgrades. Startfüllung 60 %, aus früherem erneuerbarem Überschuss. Geladen wird nur aus tatsächlich verfügbarem Überschuss. Erneuerbare Anteile werden im Speicher mitgeführt.</p><p class="model-note"><strong>Bilanz:</strong> Erzeugung + Entladung = gedeckter Verbrauch + Ladung + nicht abgefangener Überschuss. Speicherverluste entstehen zusätzlich innerhalb der Speicher. Fehlender Strom wird als ungedeckter Bedarf bilanziert. Erneuerbare dürfen abgeregelt werden.</p><p class="model-note"><strong>Emissionen, vereinfachte Modellfaktoren:</strong> Gas 0,42 · Kohle 0,90 · Biomasse 0,08 · Atomstrom 0,015 t CO₂e/MWh; PV/Wind/Wasser 0 im Spiel. Diese Spielwerte sind kein vollständiger Lebenszyklusvergleich. Emissionen werden bei der Erzeugung gezählt, beim Entladen nicht erneut. Biomasse ist erneuerbar, aber nicht emissionsfrei.</p><p class="model-note"><strong>Kosten:</strong> Erneuerbare 15, Biomasse 65, Gas 125, Kohle 165, Import 225 €/MWh. Kosten sind ein Ergebniswert, kein zusätzliches Punktelimit. Gas und Kohle besitzen je Szenario unterschiedliche Energiebudgets.</p><p class="model-note"><strong>Punkte:</strong> 500 × Versorgung (1 minus vierfacher ungedeckter Anteil minus ¼ des Überschussanteils); 350 × Klima (65 % erneuerbarer Versorgungsanteil + 35 % vermiedene Emissionen gegenüber 0,9 t/MWh); 150 × Speicherstrategie (45 % Ladeeffizienz, 35 % Überschussnutzung, 20 % Versorgung). Jeweils auf 0–100 % begrenzt. Kein Defizit ist wichtiger als das Vermeiden einer notwendigen Reserve.</p><p class="model-note"><strong>Wetter:</strong> Reproduzierbarer Tagesverlauf mit festem Startwert. Prognosen weichen bei Wind um bis zu 6,5 Prozentpunkte und bei PV um bis zu 10 % ab. Speicherausbau und PV-Investitionen verändern die verfügbaren Kapazitäten. Die lokale Bestenliste zeigt Szenario und Ausbau getrennt.</p>`);}
function board(){stopAuto();const list=storage.get('board',[]);modal(`<div class="eyebrow">DIE BESTEN DIESER LEITSTELLE</div><h2 id="modal-title">Wer hält die Region am Laufen?</h2><p>Gespeichert auf diesem Gerät und in diesem Browser. Für einen fairen Vergleich: gleiches Szenario und gleiche Ausbaustufe wählen.</p>${list.length?`<table class="board-table"><thead><tr><th>Platz · Name</th><th>Szenario / Ausbau</th><th>Punkte</th></tr></thead><tbody>${list.slice(0,20).map((e,i)=>`<tr><td>${i+1}. ${escape(e.name)}</td><td>${escape(e.mode)}<br><small>${e.upgraded?'Mit Ausbau':'Basisnetz'}</small></td><td>${e.points}</td></tr>`).join('')}</tbody></table>`:'<div class="event-option" style="margin-top:22px"><strong>Hier ist noch alles offen.</strong><small>Spiele einen Tag und setze die erste Bestmarke.</small></div>'}<button class="secondary" data-action="close" style="margin-top:20px">Zurück zum Netz</button>`);}
function resultsPage(){screen='result';const sc=score(state);if(state.scenario.id>0&&sc.deficit<.1&&!profile.won.includes(state.scenario.id)){profile.won.push(state.scenario.id);profile.credits+=3;storage.set('profile',profile);}const title=sc.points>=900?'Du bist ein Energiegenie.':sc.points>=700?'Gut geplant. Gut versorgt.':sc.points>=450?'Jeder Tag macht dich besser.':'Morgen ist ein neuer Energietag.';const awards=[];if(sc.deficit<.1)awards.push('Netzretter:in');if(sc.fossil<.1)awards.push('Fossilfrei durch die Nacht');if(sc.charged>40&&sc.deficit<3)awards.push('Meister:in der Speicher');if(sc.renewPercent>85)awards.push('Windflüsterer');if(sc.points>=900)awards.push('Energiegenie');
 app.innerHTML=`<div class="shell">${header()}<main><div class="gamehead"><div><div class="eyebrow">DEIN TAG IST GESCHAFFT</div><h1>${state.scenario.name} · Tagesauswertung</h1><p>Deine Entscheidungen haben einen Unterschied gemacht.</p></div><button class="secondary" data-action="restart">Noch einmal ↻</button></div><div class="result-world"><div><section class="score-card"><div class="tiny" style="color:#b6c6ae">DEINE NETZMEISTER-PUNKTE</div><div class="score-number">${sc.points}<span> / 1.000</span></div><div class="stars" aria-label="${sc.stars} von 3 Sternen">${'★'.repeat(sc.stars)}${'☆'.repeat(3-sc.stars)}</div><h1>${title}</h1><div class="score-breakdown">${[['Versorgungssicherheit',sc.security,500],['Klimafreundlichkeit',sc.climate,350],['Strategie & Speicher',sc.strategy,150]].map(([n,v,m])=>`<div><div class="score-row"><span>${n}</span><strong>${v} / ${m}</strong></div><div class="score-bar"><i style="width:${v/m*100}%"></i></div></div>`).join('')}</div></section><div class="result-stats">${[[fmt(sc.renewPercent,0)+' %','Erneuerbare an gedecktem Bedarf'],[fmt(sc.deficit)+' MWh','Nicht gedeckter Strombedarf'],[fmt(sc.fossil)+' MWh','Fossile Erzeugung'],[fmt(sc.carbon)+' t','CO₂e aus Erzeugung'],[fmt(sc.cost,0)+' €','Modell-Betriebskosten'],[fmt(sc.loss)+' MWh','Speicherverluste']].map(([n,l])=>`<div class="result-stat"><strong>${n}</strong><small>${l}</small></div>`).join('')}</div><div>${awards.map(a=>`<span class="badge">✦ ${a}</span>`).join('')}</div><form id="save-score" class="save-score"><label for="player">Dein Name für die lokale Bestenliste</label><input id="player" name="player" maxlength="24" placeholder="z. B. Team Sonnenkraft" autocomplete="off" required><button class="primary" type="submit">Eintragen ↗</button></form></div><section class="insights"><h2>Was dein Tag erzählt.</h2><div class="world ${state.history.at(-1).h>=18?'dusk':''}" style="height:270px" id="replay-world">${worldFromRecord(state.history.at(-1))}</div><div class="replay"><label for="replay-range">Dein Tag als Zeitreise <span id="replay-time">${time(state.history.at(-1).h)}</span></label><input id="replay-range" type="range" min="0" max="${state.history.length-1}" value="${state.history.length-1}" aria-label="Stunde für Tagesrückblick wählen"><p id="replay-detail"></p><button class="textbtn" data-action="replay" style="font-size:10px;padding-bottom:0">▷ Tag abspielen</button></div>${[
 ['Sonne und Wind haben ihren eigenen Fahrplan.',`Dein erneuerbarer Versorgungsanteil: ${fmt(sc.renewPercent)} %. Das Wetterangebot war nicht regelbar. Du konntest es nutzen, speichern oder abregeln. ${fmt(sc.curtailed)} MWh wurden abgeregelt.`],
 ['Dein Pumpspeicher verschiebt Energie.',`Du hast ${fmt(sc.charged)} MWh in Speicher geladen. Beim Laden und Entladen gingen insgesamt ${fmt(sc.loss)} MWh verloren. Ein Pumpspeicher ist eine zeitliche Brücke, keine zusätzliche Energiequelle.`],
 ['Ein guter Mix hält die Region am Laufen.',`${fmt(sc.deficit)} MWh blieben ungedeckt. ${sc.deficit<.1?'Die Region war jede Stunde versorgt.':'Schau im Rückblick, wann Strom gefehlt hat. Vor diesen Stunden lohnt sich ein höherer Speicherstand oder früheres Hochfahren der Biomasse.'} Gas und Kohle lieferten zusammen ${fmt(sc.fossil)} MWh.`],
 ['Versorgung und Klima gehören zusammen.',`Deine Erzeugung verursachte im vereinfachten Modell ${fmt(sc.carbon)} t CO₂e. Ein reiner Gas-Referenzbetrieb für denselben gedeckten Bedarf ergibt ${fmt(sc.reference)} t. Deine Differenz: ${fmt(Math.abs(sc.avoided))} t ${sc.avoided>=0?'weniger':'mehr'}. Startspeicher sind erneuerbar vorgeladen; der Vergleich berücksichtigt keine historische Beladung oder Kraftwerksinvestitionen.`]
 ].map(([t,p],i)=>`<details class="insight" ${i===0?'open':''}><summary>${t}</summary><p>${p}</p></details>`).join('')}<div style="display:flex;flex-wrap:wrap;gap:10px;margin:23px 0"><button class="primary" data-action="home">Nächsten Tag wählen ↗</button><button class="secondary" data-action="invest">Region ausbauen · ${profile.credits} Punkte</button></div></section></div></main><div style="height:30px"></div>${footer()}</div>`;showReplay(state.history.length-1);window.scrollTo({top:0,behavior:'instant'});}
function worldFromRecord(r){return scene({h:r.h,wind:r.w.windFactor,pv:r.pv,pump:r.stores.pump.energy/r.stores.pump.capacity,battery:r.stores.battery.energy/r.stores.battery.capacity,bio:r.output.bio,gas:r.output.gas,coal:r.output.coal,bad:r.deficit>1,cloud:r.w.cloud,interactive:false});}
function showReplay(i){const r=state.history[i];if(!r)return;$('#replay-world').innerHTML=worldFromRecord(r);$('#replay-world').className=`world ${r.h<6||r.h>=21?'night':r.h>=18?'dusk':''}`;$('#replay-time').textContent=time(r.h);$('#replay-detail').textContent=`Bedarf ${fmt(r.demand)} MW · Angebot ${fmt(r.totalSupply)} MW · ${r.deficit>.05?fmt(r.deficit)+' MW fehlten':r.surplus>.05?fmt(r.surplus)+' MW Überschuss':'Versorgung gesichert'} · Speicher ${fmt(r.stores.pump.energy+r.stores.battery.energy)} MWh`;
}
function investments(){modal(`<div class="eyebrow">KLEINE INVESTITIONEN. GROSSE WIRKUNG.</div><h2 id="modal-title">Baue deine Region weiter.</h2><p>Für jedes erstmals ohne Stromdefizit abgeschlossene 24-Stunden-Szenario erhältst du 3 Ausbaupunkte. Investitionen gelten ab der nächsten Runde und verändern die Spielmechanik.</p><p style="margin:15px 0"><strong>Dein Budget: ${profile.credits} Ausbaupunkte</strong></p>${[
 ['battery','Batterie erweitern','+15 MWh Kapazität',2],['pump','Oberbecken vergrößern','+40 MWh Kapazität',3],['pv','Solardächer ergänzen','+20 % PV-Leistung',2]
 ].map(([k,n,d,c])=>`<div class="upgrade"><div><strong>${n}</strong><small>${d} · ${c} Punkte${profile.upgrades[k]?' · Bereits gebaut':''}</small></div><button data-upgrade="${k}" ${profile.credits<c||profile.upgrades[k]?'disabled':''}>Bauen ↗</button></div>`).join('')}<p class="model-note">Bestenlisten-Einträge zeigen an, ob ein Ausbau aktiv war. Ausbaupunkte werden nur einmal je Szenario vergeben.</p><button class="secondary" data-action="reset-upgrades" style="margin-top:16px">Zum Basisnetz zurückkehren</button>`);}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-plant]');if(!b)return;
 if(b.dataset.scenario!==undefined){selected=Number(b.dataset.scenario);startPage();return;}
 if(b.dataset.store){const k=b.dataset.store;state.controls[k]=b.dataset.mode==='stop'?0:b.dataset.mode==='charge'?-Math.min(STORE[k].power,10):Math.min(STORE[k].power,10);$('#range-'+k).value=state.controls[k];updateDashboard();return;}
 if(b.dataset.plant){const k=b.dataset.plant;if(k==='wind'||k==='hydro'){modal(`<div class="eyebrow">ERNEUERBARES ANGEBOT</div><h2 id="modal-title">${k==='wind'?'Der Wind macht den Fahrplan.':'Stetig, aber begrenzt.'}</h2><p>${k==='wind'?'Windstrom kannst du nicht nach Belieben hochregeln. Schau auf die Prognose und speichere Überschüsse. Die Drehgeschwindigkeit in der Landschaft folgt dem Windangebot.':'Laufwasser liefert im Spiel 7 MW, bei Dunkelflaute 5,5 MW. Das ist eine begrenzte Grundproduktion. Das Wasser lässt sich hier nicht für später zurückhalten.'}</p><button class="primary" data-action="close" style="margin-top:20px">Zurück zur Leitstelle ↗</button>`);return;}const el=$('#control-'+k);el?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});el?.classList.add('highlight');setTimeout(()=>el?.classList.remove('highlight'),1600);$('#range-'+k)?.focus({preventScroll:true});return;}
 if(b.dataset.event){const card=eventFor(state);if(card&&card.id===b.dataset.event){state=chooseEvent(state,card,b.dataset.choice);closeModal();save();gamePage();}return;}
 if(b.dataset.upgrade){const k=b.dataset.upgrade,c=k==='pump'?3:2;if(profile.credits>=c&&!profile.upgrades[k]){profile.credits-=c;profile.upgrades[k]=k==='pump'?40:k==='battery'?15:.2;storage.set('profile',profile);investments();}return;}
 switch(b.dataset.action){
 case 'start':begin();break;case 'tutorial':begin(0);break;case 'resume':if(saved){state=structuredClone(saved);gamePage();}break;
 case 'home':if(screen==='game'){stopAuto();modal(`<div class="eyebrow">DEIN FAHRPLAN BLEIBT GESPEICHERT</div><h2 id="modal-title">Zur Szenarioauswahl?</h2><p>Du kannst diesen Tag über „Fortsetzen“ wieder aufnehmen, solange du keine neue Runde startest.</p><div class="hero-actions"><button class="primary" data-action="home-confirm">Zur Auswahl ↗</button><button class="secondary" data-action="close">Weiterspielen</button></div>`);}else startPage();break;
 case 'home-confirm':closeModal();startPage();break;case 'step':step();break;case 'help':help();break;case 'model':model();break;case 'board':board();break;case 'close':closeModal();break;case 'restart':begin(state.scenario.id);break;
 case 'pause':stopAuto();modal(`<div class="eyebrow">KURZ DURCHATMEN</div><h2 id="modal-title">Deine Region wartet.</h2><p>Das Spiel ist pausiert. Im manuellen Modus vergeht zwischen zwei bestätigten Stunden ohnehin keine Zeit. Dein Fahrplan ist lokal gespeichert.</p><button class="primary" data-action="close" style="margin-top:22px">Zurück zur Leitstelle ↗</button>`);break;
 case 'auto':if(auto)stopAuto();else{b.textContent='Ⅱ Auto pausieren';auto=setInterval(()=>{if(dialogs.innerHTML){stopAuto();return;}step();},6000);}break;
 case 'replay':if(replayTimer){stopReplay();b.textContent='▷ Tag abspielen';}else{let n=0;showReplay(n);$('#replay-range').value=n;b.textContent='Ⅱ Zeitreise pausieren';replayTimer=setInterval(()=>{n++;if(n>=state.history.length){stopReplay();b.textContent='▷ Tag abspielen';return;}showReplay(n);$('#replay-range').value=n;},850);}break;
 case 'invest':investments();break;case 'reset-upgrades':{const refund=Object.keys(profile.upgrades).reduce((a,k)=>a+(k==='pump'?3:2),0);profile.credits+=refund;profile.upgrades={};storage.set('profile',profile);investments();break;}
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.control){state.controls[e.target.dataset.control]=Number(e.target.value);updateDashboard();}else if(e.target.id==='replay-range'){stopReplay();const b=$('[data-action="replay"]');if(b)b.textContent='▷ Tag abspielen';showReplay(Number(e.target.value));}});
document.addEventListener('change',e=>{if(e.target.id==='curtail'){state.controls.curtail=e.target.checked;updateDashboard();}});
document.addEventListener('submit',e=>{if(e.target.id==='save-score'){e.preventDefault();const name=$('#player').value.trim();if(!name)return;const rows=storage.get('board',[]),sc=score(state);rows.push({name:name.slice(0,24),points:sc.points,mode:state.scenario.name,upgraded:Object.keys(state.upgrades).length>0,date:new Date().toISOString()});rows.sort((a,b)=>b.points-a.points);if(storage.set('board',rows.slice(0,50))){e.target.innerHTML='<label>✓ Deine Punktzahl ist eingetragen.</label><button type="button" class="secondary" data-action="board">Bestenliste öffnen ↗</button>';}else e.target.insertAdjacentHTML('beforeend','<p class="notice">Der Browser erlaubt gerade keine lokale Speicherung.</p>');}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-plant]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(!dialogs.innerHTML)return;const close=dialogs.querySelector('[data-action="close"]');if(e.key==='Escape'&&close)closeModal();if(e.key==='Tab'){const list=[...dialogs.querySelectorAll('button:not(:disabled),input,select,a[href]')];if(!list.length)return;const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
startPage();
</script></body></html>
